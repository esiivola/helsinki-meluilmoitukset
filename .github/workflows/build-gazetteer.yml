name: Rebuild gazetteer

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-gazetteer.mjs
      - .github/workflows/build-gazetteer.yml
  schedule:
    # The address, place-name and district registers change slowly; monthly is
    # ample and keeps the committed gazetteer's history small.
    - cron: '41 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gazetteer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Rebuild from Helsinki WFS
        run: node scripts/build-gazetteer.mjs

      - name: Install dependencies
        run: npm ci

      # The geocoding tests run against the committed gazetteer, so a register
      # change that would break address resolution is caught before it lands.
      - name: Run tests
        run: npm test

      - name: Commit updated gazetteer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gazetteer.json
          if git diff --cached --quiet; then
            echo "Gazetteer unchanged"
          else
            git commit -m "Rebuild gazetteer from Helsinki open data"
            git push
          fi
